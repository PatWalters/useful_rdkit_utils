# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    # 3.12 is the newest version the CI matrix covers, and it is new enough for the
    # current releases of numpy and scipy, which both require >= 3.12
    python: "3.12"

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/source/conf.py

# If using Sphinx, optionally build your docs in additional formats such as PDF
# formats:
#    - pdf

# Install the package itself, so the runtime dependencies come from pyproject.toml
# and cannot drift. "docs" brings the Sphinx toolchain; "extras" brings click, which
# sphinx-click needs to document the build_ring_dictionary command.
python:
   install:
   - method: pip
     path: .
     extra_requirements:
       - docs
       - extras
